[package]
name = "agent_validator"
version = "0.1.0"
edition = "2021"
description = "AetherionOS Immune System - JSON Coherence Validator Agent"

[[bin]]
name = "agent_validator"
path = "src/main.rs"

[dependencies]
aetherion_sdk = { path = "../rust_sdk" }

[profile.release]
opt-level = 2
lto = false
panic = "abort"
codegen-units = 1
