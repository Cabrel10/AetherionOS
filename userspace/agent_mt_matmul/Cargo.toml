[package]
name = "agent_mt_matmul"
version = "0.1.0"
edition = "2021"
description = "AetherionOS Jalon 51 - Multithreaded MatMul via sys_clone/sys_wait (Ring 3)"

[[bin]]
name = "agent_mt_matmul"
path = "src/main.rs"

[dependencies]
aetherion_sdk = { path = "../rust_sdk" }

[profile.release]
opt-level = 2
lto = false
panic = "abort"
codegen-units = 1
