[package]
name = "agent_mcp"
version = "0.1.0"
edition = "2021"
description = "AetherionOS Level 8 - MCP (Model Context Protocol) Agent"

[[bin]]
name = "agent_mcp"
path = "src/main.rs"

[dependencies]
aetherion_sdk = { path = "../rust_sdk" }

[profile.release]
opt-level = 2
lto = false
panic = "abort"
codegen-units = 1
