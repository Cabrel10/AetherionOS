[package]
name = "agent_inference"
version = "0.1.0"
edition = "2021"
description = "AetherionOS Jalon 47 - GGUF Tensor Metadata Inspector (Ring 3)"

[[bin]]
name = "agent_inference"
path = "src/main.rs"

[dependencies]
aetherion_sdk = { path = "../rust_sdk" }

[profile.release]
opt-level = 2
lto = true
panic = "abort"
codegen-units = 1
