[package]
name = "agent_llm_chat"
version = "0.1.0"
edition = "2021"
description = "AetherionOS Jalon 64 - Full LLM Chat Agent loading GGUF from FAT32 Disk"

[[bin]]
name = "agent_llm_chat"
path = "src/main.rs"

[dependencies]
aetherion_sdk = { path = "../rust_sdk" }

[profile.release]
opt-level = 2
lto = false
panic = "abort"
codegen-units = 1
