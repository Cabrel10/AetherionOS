[package]
name = "agent_llama"
version = "0.1.0"
edition = "2021"
description = "AetherionOS Jalon 49 - Bare-Metal LLM Transformer Math Engine (Ring 3)"

[[bin]]
name = "agent_llama"
path = "src/main.rs"

[dependencies]
aetherion_sdk = { path = "../rust_sdk" }

[profile.release]
opt-level = 2
lto = false
panic = "abort"
codegen-units = 1
