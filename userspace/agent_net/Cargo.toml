[package]
name = "agent_net"
version = "0.1.0"
edition = "2021"
description = "AetherionOS Jalon 37 - Network Agent (Ring 3)"

[[bin]]
name = "agent_net"
path = "src/main.rs"

[dependencies]
aetherion_sdk = { path = "../rust_sdk" }

[profile.release]
opt-level = 2
lto = false
panic = "abort"
codegen-units = 1
