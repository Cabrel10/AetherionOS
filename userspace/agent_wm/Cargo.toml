[package]
name = "agent_wm"
version = "0.1.0"
edition = "2021"
description = "AetherionOS Jalon 41 - Cognitive Desktop Window Manager (Ring 3)"

[[bin]]
name = "agent_wm"
path = "src/main.rs"

[dependencies]
aetherion_sdk = { path = "../rust_sdk" }

[profile.release]
opt-level = 2
lto = true
panic = "abort"
codegen-units = 1
