[package]
name = "agent_multipart"
version = "0.1.0"
edition = "2021"
description = "AetherionOS Jalon 43 - Multi-Part GGUF File Merger (Ring 3)"

[[bin]]
name = "agent_multipart"
path = "src/main.rs"

[dependencies]
aetherion_sdk = { path = "../rust_sdk" }

[profile.release]
opt-level = 2
lto = false
panic = "abort"
codegen-units = 1
