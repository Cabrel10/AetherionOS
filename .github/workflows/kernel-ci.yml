name: AetherionOS Kernel CI

on:
  push:
    branches: [ genspark_ai_developer, main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C opt-level=2"
  CARGO_HOME: /home/runner/.cargo
  CARGO_INCREMENTAL: 0

jobs:
  # ═══════════════════════════════════════════════════════════
  # Job 1: Cargo check (compilation correctness)
  # ═══════════════════════════════════════════════════════════
  check:
    name: Cargo Check (kernel lib)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Cargo check (library)
        run: cargo check --lib 2>&1 | tee check_output.txt

      - name: Verify no errors
        run: |
          if grep -q "^error" check_output.txt; then
            echo "::error::Cargo check failed with errors"
            exit 1
          fi
          echo "Cargo check passed (warnings only)"

      - name: Count warnings
        run: |
          WARNINGS=$(grep -c "^warning:" check_output.txt || echo "0")
          echo "Total warnings: $WARNINGS"
          echo "## Cargo Check Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: PASS" >> $GITHUB_STEP_SUMMARY
          echo "- **Warnings**: $WARNINGS" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════
  # Job 2: Build ISO + ext2 rootfs + QEMU Python3 integration test
  # ═══════════════════════════════════════════════════════════
  qemu-python3-test:
    name: QEMU Python3 Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Add swap space (prevent OOM)
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 xorriso mtools e2fsprogs wget

      - name: Get Limine bootloader (prebuilt binary branch)
        run: |
          # Clone the prebuilt binary branch (no compilation needed)
          git clone https://github.com/limine-bootloader/limine.git \
            --branch=v8.x-binary --depth=1 /tmp/limine-bin

          # Build just the host 'limine' CLI tool (for bios-install)
          cd /tmp/limine-bin && make -j$(nproc) 2>&1 | tail -5
          cd "$GITHUB_WORKSPACE"

          # Copy prebuilt binaries using absolute paths
          mkdir -p "$GITHUB_WORKSPACE/third_party/limine"
          cp -v /tmp/limine-bin/limine-bios-cd.bin "$GITHUB_WORKSPACE/third_party/limine/"
          cp -v /tmp/limine-bin/limine-bios.sys "$GITHUB_WORKSPACE/third_party/limine/"
          cp -v /tmp/limine-bin/BOOTX64.EFI "$GITHUB_WORKSPACE/third_party/limine/"
          cp -v /tmp/limine-bin/limine-uefi-cd.bin "$GITHUB_WORKSPACE/third_party/limine/" 2>/dev/null || true
          cp -v /tmp/limine-bin/limine "$GITHUB_WORKSPACE/third_party/limine/" 2>/dev/null || true
          # Verify critical files
          for f in limine-bios-cd.bin limine-bios.sys BOOTX64.EFI; do
            if [ ! -f "$GITHUB_WORKSPACE/third_party/limine/$f" ]; then
              echo "::error::Missing Limine binary: $f"
              exit 1
            fi
          done
          ls -la "$GITHUB_WORKSPACE/third_party/limine/"
          echo "[OK] Limine v8.x prebuilt binaries ready"

      - name: Create stub ELF binaries for include_bytes!
        run: |
          echo "=== Creating stub ELF binaries ==="
          # The kernel binary (main.rs) uses include_bytes!() to embed ELF files
          # that are not tracked in git. Create minimal stubs so cargo build succeeds.
          # A minimal valid x86-64 ELF header (120 bytes)
          python3 -c "
          import struct
          # Minimal ELF64 header
          elf = bytearray(120)
          # ELF magic
          elf[0:4] = b'\x7fELF'
          elf[4] = 2  # 64-bit
          elf[5] = 1  # little-endian
          elf[6] = 1  # ELF version
          elf[7] = 3  # Linux ABI
          # e_type = ET_EXEC (2)
          struct.pack_into('<H', elf, 16, 2)
          # e_machine = EM_X86_64 (62)
          struct.pack_into('<H', elf, 18, 62)
          # e_version
          struct.pack_into('<I', elf, 20, 1)
          # e_entry
          struct.pack_into('<Q', elf, 24, 0x400000)
          # e_phoff = 64
          struct.pack_into('<Q', elf, 32, 64)
          # e_ehsize = 64
          struct.pack_into('<H', elf, 52, 64)
          # e_phentsize = 56
          struct.pack_into('<H', elf, 54, 56)
          # e_phnum = 1
          struct.pack_into('<H', elf, 56, 1)
          # Write a PT_LOAD program header at offset 64
          # p_type = PT_LOAD (1)
          struct.pack_into('<I', elf, 64, 1)
          # p_flags = PF_R|PF_X (5)
          struct.pack_into('<I', elf, 68, 5)
          import sys
          sys.stdout.buffer.write(bytes(elf))
          " > /tmp/stub.elf

          # Create all needed bin_cache stubs
          mkdir -p bin_cache
          for f in agent_ai_native agent_gguf agent_net agent_input agent_gui_test \
                   agent_sysinfo agent_wm agent_terminal agent_multipart agent_bench \
                   agent_tokenizer agent_inference agent_llama agent_llm_chat \
                   agent_mt_matmul agent_chunk_reader agent_weight_loader \
                   agent_orchestrator agent_state agent_http agent_visual_term \
                   agent_q4_dequant agent_llama_core agent_mcp agent_validator \
                   agent_clock agent_memory agent_autonomous busybox; do
            [ -f "bin_cache/$f" ] || cp /tmp/stub.elf "bin_cache/$f"
          done
          echo "  bin_cache: $(ls bin_cache/ | wc -l) files"

          # Create all needed userspace stubs
          mkdir -p userspace/c_apps
          for f in hello.elf; do
            [ -f "userspace/$f" ] || cp /tmp/stub.elf "userspace/$f"
          done
          for f in sh.elf agent_math.elf hello_c.elf wget.elf ls.elf cat.elf \
                   j19_test.elf threads.elf ui.elf agent_ai.elf agent_rag.elf \
                   test_malloc.elf test_preempt.elf agent_rust.elf agent_saga.elf \
                   agent_sse.elf wget_real.elf; do
            [ -f "userspace/c_apps/$f" ] || cp /tmp/stub.elf "userspace/c_apps/$f"
          done
          echo "  userspace: $(ls userspace/*.elf userspace/c_apps/*.elf 2>/dev/null | wc -l) files"
          echo "[OK] All stub ELFs created"

      - name: Build kernel ELF (release)
        run: |
          LINKER_SCRIPT="$(pwd)/kernel/linker-x86_64.ld"
          # -C relocation-model=static => ET_EXEC (not PIE/ET_DYN)
          # Limine v8.x panics on ET_DYN without PT_DYNAMIC segment
          RUSTFLAGS="-C opt-level=2 -C relocation-model=static -C link-arg=-T${LINKER_SCRIPT} -C link-arg=-no-pie" \
            cargo build -p aetherion-kernel \
            --target x86_64-unknown-none \
            --features limine \
            --release 2>&1 | tail -30
          # Verify the kernel is ET_EXEC, not ET_DYN
          file target/x86_64-unknown-none/release/aetherion-kernel
          ls -lh target/x86_64-unknown-none/release/aetherion-kernel
          readelf -h target/x86_64-unknown-none/release/aetherion-kernel | grep -i "type:" || true
          echo "[OK] Kernel ELF built (release, static)"

      - name: Create bootable ISO
        run: |
          ISO_DIR=target/limine-iso
          rm -rf "$ISO_DIR"
          mkdir -p "$ISO_DIR/boot/limine" "$ISO_DIR/EFI/BOOT"

          cp target/x86_64-unknown-none/release/aetherion-kernel "$ISO_DIR/boot/aetherion-kernel"
          cp limine.conf "$ISO_DIR/boot/limine/limine.conf"

          # Copy Limine binaries (may be at different paths)
          cp third_party/limine/limine-bios-cd.bin "$ISO_DIR/boot/limine/" 2>/dev/null || true
          cp third_party/limine/limine-bios.sys "$ISO_DIR/boot/limine/" 2>/dev/null || true
          cp third_party/limine/limine-uefi-cd.bin "$ISO_DIR/boot/limine/" 2>/dev/null || true
          cp third_party/limine/BOOTX64.EFI "$ISO_DIR/EFI/BOOT/BOOTX64.EFI" 2>/dev/null || true

          # Verify required files exist
          echo "=== ISO directory contents ==="
          find "$ISO_DIR" -type f

          # Build ISO with appropriate options based on available files
          XORRISO_ARGS=()
          if [ -f "$ISO_DIR/boot/limine/limine-bios-cd.bin" ]; then
            XORRISO_ARGS+=(-b boot/limine/limine-bios-cd.bin -no-emul-boot -boot-load-size 4 -boot-info-table)
          fi
          if [ -f "$ISO_DIR/boot/limine/limine-uefi-cd.bin" ]; then
            XORRISO_ARGS+=(--efi-boot boot/limine/limine-uefi-cd.bin -efi-boot-part --efi-boot-image)
          elif [ -f "$ISO_DIR/EFI/BOOT/BOOTX64.EFI" ]; then
            XORRISO_ARGS+=(--efi-boot EFI/BOOT/BOOTX64.EFI -efi-boot-part --efi-boot-image)
          fi

          xorriso -as mkisofs \
            "${XORRISO_ARGS[@]}" \
            --protective-msdos-label \
            "$ISO_DIR" -o target/aetherion-os.iso 2>&1

          # Install Limine BIOS
          if [ -x third_party/limine/limine ]; then
            third_party/limine/limine bios-install target/aetherion-os.iso 2>&1 || true
          fi

          ls -lh target/aetherion-os.iso
          echo "[OK] ISO created"

      - name: Create ext2 rootfs with Alpine + Python3
        run: |
          echo "=== Creating ext2 rootfs with Python3 ==="

          # Download Alpine minirootfs
          ALPINE_VERSION="3.20"
          for REL in 6 5 4 3 2 1 0; do
            ALPINE_URL="https://dl-cdn.alpinelinux.org/alpine/v${ALPINE_VERSION}/releases/x86_64/alpine-minirootfs-${ALPINE_VERSION}.${REL}-x86_64.tar.gz"
            wget -q "$ALPINE_URL" -O /tmp/alpine-minirootfs.tar.gz && break || true
          done
          ls -lh /tmp/alpine-minirootfs.tar.gz

          # Create ext2 image (256 MiB — room for Python3)
          dd if=/dev/zero of=target/rootfs.ext2 bs=1M count=256
          mkfs.ext2 -F target/rootfs.ext2

          # Mount and populate
          MNTDIR=$(mktemp -d)
          sudo mount -o loop target/rootfs.ext2 "$MNTDIR"

          # Extract Alpine base (includes busybox, musl, apk tools)
          sudo tar xzf /tmp/alpine-minirootfs.tar.gz -C "$MNTDIR"

          # Setup DNS for chroot
          sudo mkdir -p "$MNTDIR/etc"
          echo "nameserver 8.8.8.8" | sudo tee "$MNTDIR/etc/resolv.conf"

          # Use apk inside chroot to install python3 properly
          # Mount required filesystems for chroot
          sudo mount --bind /dev "$MNTDIR/dev" || true
          sudo mount -t proc proc "$MNTDIR/proc" || true
          sudo mount -t sysfs sys "$MNTDIR/sys" || true

          # Setup Alpine repositories
          echo "https://dl-cdn.alpinelinux.org/alpine/v${ALPINE_VERSION}/main" | sudo tee "$MNTDIR/etc/apk/repositories"
          echo "https://dl-cdn.alpinelinux.org/alpine/v${ALPINE_VERSION}/community" | sudo tee -a "$MNTDIR/etc/apk/repositories"

          # Install Python3 via apk in chroot
          sudo chroot "$MNTDIR" /sbin/apk update 2>&1 | tail -3
          sudo chroot "$MNTDIR" /sbin/apk add --no-cache python3 2>&1 | tail -10
          echo "  Python3 install exit code: $?"

          # Verify critical files exist
          echo "=== Rootfs verification ==="
          for f in bin/busybox lib/ld-musl-x86_64.so.1 usr/bin/python3; do
            if sudo test -f "$MNTDIR/$f" || sudo test -L "$MNTDIR/$f"; then
              SIZE=$(sudo stat -Lc%s "$MNTDIR/$f" 2>/dev/null || echo 'symlink')
              echo "  [OK] /$f ($SIZE bytes)"
            else
              echo "  [MISSING] /$f"
            fi
          done

          # Test python3 actually works
          sudo chroot "$MNTDIR" /usr/bin/python3 -c "print(42*42)" 2>&1 || echo "  WARN: python3 chroot test failed"

          # Create essential directories
          sudo mkdir -p "$MNTDIR/dev" "$MNTDIR/proc" "$MNTDIR/sys" "$MNTDIR/tmp"
          sudo ln -sf /bin/busybox "$MNTDIR/bin/sh" 2>/dev/null || true

          # Show ld-musl info
          echo "=== Dynamic linker ==="
          sudo ls -la "$MNTDIR/lib/ld-musl"* 2>/dev/null || true
          file "$MNTDIR/lib/ld-musl-x86_64.so.1" 2>/dev/null || true
          echo "=== Python3 binary ==="
          sudo ls -la "$MNTDIR/usr/bin/python3"* 2>/dev/null || true
          file "$MNTDIR/usr/bin/python3" 2>/dev/null || true
          sudo ls -la "$MNTDIR/usr/lib/libpython"* 2>/dev/null || true

          # Show total size
          echo "=== Disk usage ==="
          # Cleanup mounts BEFORE du to avoid /proc race
          sudo umount "$MNTDIR/dev" 2>/dev/null || true
          sudo umount "$MNTDIR/proc" 2>/dev/null || true
          sudo umount "$MNTDIR/sys" 2>/dev/null || true
          sudo du -sh "$MNTDIR" 2>/dev/null || true

          sudo umount "$MNTDIR"
          rmdir "$MNTDIR"

          ls -lh target/rootfs.ext2
          echo "[OK] ext2 rootfs with Python3 created"

      - name: QEMU boot test (kernel + auto-exec python3 - 60s)
        run: |
          echo "=== QEMU Kernel Boot Test ==="
          echo "=== ISO contents check ==="
          xorriso -indev target/aetherion-os.iso -ls / 2>&1 || true
          xorriso -indev target/aetherion-os.iso -ls /boot/ 2>&1 || true
          xorriso -indev target/aetherion-os.iso -ls /boot/limine/ 2>&1 || true
          
          echo "=== limine.conf in ISO ==="
          xorriso -indev target/aetherion-os.iso -osirrox on -extract /boot/limine/limine.conf /tmp/limine-check.conf 2>&1 || true
          cat /tmp/limine-check.conf 2>/dev/null || echo "WARN: could not extract limine.conf"
          
          echo "=== Kernel ELF check ==="
          xorriso -indev target/aetherion-os.iso -osirrox on -extract /boot/aetherion-kernel /tmp/kernel-check.elf 2>&1 || true
          file /tmp/kernel-check.elf 2>/dev/null || echo "WARN: could not extract kernel"
          ls -lh /tmp/kernel-check.elf 2>/dev/null || true

          # Run QEMU with serial explicitly going to a file
          timeout 60 qemu-system-x86_64 \
            -cdrom target/aetherion-os.iso \
            -drive file=target/rootfs.ext2,format=raw,if=virtio \
            -m 512M -smp 1 -no-reboot \
            -display none \
            -chardev file,id=ser0,path=/tmp/qemu-serial.log \
            -serial chardev:ser0 \
            -d int,cpu_reset -D /tmp/qemu-debug.log \
            </dev/null 2>/dev/null || true

          echo "=== Serial output ==="
          cat /tmp/qemu-serial.log 2>/dev/null || echo "(no serial output)"
          echo ""
          echo "=== Serial hex dump ==="
          xxd /tmp/qemu-serial.log 2>/dev/null | head -32 || echo "(empty)"

          echo "=== QEMU debug log (first 50 lines) ==="
          head -50 /tmp/qemu-debug.log 2>/dev/null || echo "(no debug log)"
          echo "=== QEMU debug log (last 30 lines) ==="
          tail -30 /tmp/qemu-debug.log 2>/dev/null || echo "(no debug log)"

          # Check for basic boot success
          echo "=== Boot markers ==="
          grep -c "AETHERION_BOOT" /tmp/qemu-serial.log || echo "0 AETHERION_BOOT (early serial)"
          grep -c "LIMINE" /tmp/qemu-serial.log || echo "0 LIMINE messages"
          grep -c "EXT2" /tmp/qemu-serial.log || echo "0 ext2 messages"
          grep -c "1764" /tmp/qemu-serial.log || echo "0 python3 (1764) messages"
          grep -c "CI-TEST" /tmp/qemu-serial.log || echo "0 CI-TEST messages"

      - name: QEMU Python3 test (exec + ld-musl)
        run: |
          echo "=== QEMU Python3 Test ==="
          echo "Sending: python3 -c 'print(42*42)' via kernel shell"

          # Create a named pipe for serial I/O
          rm -f /tmp/qemu-input
          mkfifo /tmp/qemu-input

          # Start QEMU in background
          # -chardev pipe: allows bidirectional serial via named pipe
          # -display none: no VGA output
          timeout 90 qemu-system-x86_64 \
            -cdrom target/aetherion-os.iso \
            -drive file=target/rootfs.ext2,format=raw,if=virtio \
            -m 512M -smp 1 -no-reboot \
            -display none \
            -chardev file,id=ser0,path=/tmp/qemu-python3-serial.log \
            -serial chardev:ser0 \
            </dev/null 2>/dev/null &
          QPID=$!

          # Wait for QEMU to finish (or timeout)
          wait $QPID 2>/dev/null || true
          rm -f /tmp/qemu-input

          echo ""
          echo "=== Serial output (full) ==="
          cat /tmp/qemu-python3-serial.log 2>/dev/null || echo "(no serial output)"
          echo ""
          echo "=== Serial hex dump ==="
          xxd /tmp/qemu-python3-serial.log 2>/dev/null | head -32 || echo "(empty)"

          echo ""
          echo "=== Python3 / ld-musl markers ==="
          grep -iE "1764|python|musl|ld-musl|DYNLINK|INTERP|mprotect|dlopen|Exception|GP|PF-|SIGSEGV|AETHERION_BOOT" /tmp/qemu-python3-serial.log || echo "(no markers found)"

          echo ""
          echo "=== SUCCESS CHECK ==="
          # Check both the python3 serial log AND the boot serial log
          FOUND_1764=false
          if grep -q "1764" /tmp/qemu-python3-serial.log 2>/dev/null; then
            FOUND_1764=true
            echo "Found 1764 in python3 serial log"
          fi
          if grep -q "1764" /tmp/qemu-serial.log 2>/dev/null; then
            FOUND_1764=true
            echo "Found 1764 in boot serial log"
          fi

          if [ "$FOUND_1764" = "true" ]; then
            echo "SUCCESS: Python3 printed 1764 — dynamic linking works!"
            echo "## QEMU Python3 Test: PASS" >> $GITHUB_STEP_SUMMARY
            echo "- Python3 successfully computed \`42*42 = 1764\`" >> $GITHUB_STEP_SUMMARY
            echo "- Dynamic linker (ld-musl) loaded and resolved symbols" >> $GITHUB_STEP_SUMMARY
          else
            echo "FAIL: 1764 not found in any serial output"
            echo "## QEMU Python3 Test: FAIL" >> $GITHUB_STEP_SUMMARY
            echo "- Python3 did NOT produce output \`1764\`" >> $GITHUB_STEP_SUMMARY

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Python3 Serial log:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/qemu-python3-serial.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo '(empty)' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Boot Serial log:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/qemu-serial.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo '(empty)' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            # HARD FAIL: 1764 must be in the output
            exit 1
          fi

      - name: Upload QEMU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs
          path: /tmp/qemu-*.log
          retention-days: 7

  # ═══════════════════════════════════════════════════════════
  # Job 3: Syscall coverage audit (static analysis)
  # ═══════════════════════════════════════════════════════════
  syscall-audit:
    name: Syscall Coverage Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Audit critical syscalls
        run: |
          echo "## Syscall Implementation Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          SYSCALLS="sys_read sys_write sys_open sys_close sys_brk sys_mmap sys_fork sys_execve sys_exit sys_pipe sys_dup2 sys_poll sys_sendto_linux sys_recvfrom_linux sys_tcp_connect"
          FOUND=0
          TOTAL=0
          for sc in $SYSCALLS; do
            TOTAL=$((TOTAL + 1))
            if grep -q "fn $sc" kernel/src/arch/x86_64/syscall.rs kernel/src/compat/linux_abi.rs 2>/dev/null; then
              FOUND=$((FOUND + 1))
              echo "- [x] \`$sc\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "- [ ] \`$sc\` **MISSING**" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Coverage: $FOUND / $TOTAL**" >> $GITHUB_STEP_SUMMARY

      - name: Audit dynamic linker syscalls (ld-musl critical path)
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ld-musl Critical Syscall Path" >> $GITHUB_STEP_SUMMARY
          # These are the syscalls ld-musl calls in order:
          # mmap (load segments), mprotect (W^X), read, fstat, close, brk, arch_prctl(FS)
          for sc in linux_mmap linux_mprotect linux_mmap_enhanced linux_arch_prctl; do
            if grep -q "fn $sc" kernel/src/compat/linux_abi.rs; then
              echo "- [x] \`$sc\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "- [ ] \`$sc\` **MISSING**" >> $GITHUB_STEP_SUMMARY
            fi
          done

  # ═══════════════════════════════════════════════════════════
  # Job 4: Critical path verification (static checks)
  # ═══════════════════════════════════════════════════════════
  verification:
    name: Critical Path Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify ext2 interpreter loading
        run: |
          echo "## Critical Path Checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if grep -q "ext2" kernel/src/arch/x86_64/syscall.rs | grep -q "interp\|Interpreter" 2>/dev/null; then
            echo "- [x] ext2 fallback for interpreter (ld-musl)" >> $GITHUB_STEP_SUMMARY
          elif grep -q "ext2.*interp\|Interpreter.*ext2\|ext2.*ld-musl" kernel/src/arch/x86_64/syscall.rs; then
            echo "- [x] ext2 fallback for interpreter (ld-musl)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- [ ] ext2 interpreter fallback needs verification" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Verify demand paging covers interpreter region
        run: |
          if grep -q "INTERP_DEMAND\|0x7FA0\|0x7FC0" kernel/src/arch/x86_64/idt.rs; then
            echo "- [x] Demand paging covers interpreter region (0x7FA0-0x7FFF)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- [ ] Demand paging may miss interpreter region" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Verify mprotect W^X support
        run: |
          if grep -q "fn linux_mprotect\|fn walk_page_table_to_pte" kernel/src/compat/linux_abi.rs; then
            echo "- [x] mprotect with PTE-level W^X enforcement" >> $GITHUB_STEP_SUMMARY
          else
            echo "- [ ] mprotect implementation missing" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Verify file-backed mmap for .so loading
        run: |
          if grep -q "file_read_at_offset\|read_file_chunk" kernel/src/compat/linux_abi.rs; then
            echo "- [x] File-backed mmap for .so loading" >> $GITHUB_STEP_SUMMARY
          else
            echo "- [ ] File-backed mmap may be incomplete" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Verify auxiliary vector (AT_BASE, AT_ENTRY, AT_PHDR)
        run: |
          if grep -q "AT_BASE\|AT_ENTRY\|AT_PHDR" kernel/src/elf/mod.rs; then
            echo "- [x] Auxiliary vector entries for dynamic linker" >> $GITHUB_STEP_SUMMARY
          else
            echo "- [ ] Auxiliary vector missing" >> $GITHUB_STEP_SUMMARY
          fi
